[package]
name = "manga-reader-rust"
version = "1.0.0"
edition = "2021"

[[bin]]
name = "manga-reader-rust"
path = "src-rs/main.rs"

[dependencies]
tao = "0.30"
wry = "0.47"
ureq = { version = "2.10", default-features = false, features = ["tls", "gzip", "charset", "json"] }
webpki-roots = "0.26"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
sha2 = "0.10"
http = "1.1"
zip = { version = "0.6", default-features = false, features = ["deflate"] }
windows = { version = "0.58", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage",
    "Storage_Streams",
    "Globalization",
    "Foundation",
    "Foundation_Collections",
] }

[build-dependencies]
winres = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
